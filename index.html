<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hub Map — Interactive Hub Locator</title>
</head>
<body>
  <p style="font-family:sans-serif;text-align:center;margin:2rem">Hub Map লোড হচ্ছে…</p>
  <script>
    // Load the existing app/data from the current source revision and apply only
    // runtime fixes. Hub records and their coordinates remain untouched.
    (async function () {
      const sourceUrl = 'https://raw.githubusercontent.com/Fuadbla008/sfc-hub-map-view/a9052e3c9a9a2594009c9648fd2927e2ebb43ecd/index.html';
      try {
        const response = await fetch(sourceUrl, { cache: 'no-store' });
        if (!response.ok) throw new Error(`Could not load the original map (${response.status})`);
        let html = await response.text();

        const hubsLine = "const hubs = HUBS.map(a => ({ id:a[0], name:a[1], lat:a[2], lng:a[3], phone:a[4]||'' }));";
        if (!html.includes(hubsLine)) throw new Error('Could not locate hub initialization in source.');
        html = html.replace(hubsLine, `${hubsLine}\nconst mapHubs = hubs.filter(h => Number.isFinite(h.lat) && Number.isFinite(h.lng) && h.lat >= -90 && h.lat <= 90 && h.lng >= -180 && h.lng <= 180);`);

        // Only hubs with valid coordinates become map markers; all hubs remain in the list/count.
        const markerLoop = 'hubs.forEach(h => {';
        const markerLoopAt = html.indexOf(markerLoop, html.indexOf('/* --- create markers'));
        if (markerLoopAt < 0) throw new Error('Could not locate map marker loop in source.');
        html = html.slice(0, markerLoopAt) + html.slice(markerLoopAt).replace(markerLoop, 'mapHubs.forEach(h => {');

        // Hubs without coordinates must not throw while rendering list or popup details.
        html = html.replaceAll('h.lat.toFixed(3)', "(Number.isFinite(h.lat) ? h.lat.toFixed(3) : 'N/A')");
        html = html.replaceAll('h.lng.toFixed(3)', "(Number.isFinite(h.lng) ? h.lng.toFixed(3) : 'N/A')");
        html = html.replaceAll('h.lat.toFixed(4)', "(Number.isFinite(h.lat) ? h.lat.toFixed(4) : 'N/A')");
        html = html.replaceAll('h.lng.toFixed(4)', "(Number.isFinite(h.lng) ? h.lng.toFixed(4) : 'N/A')");

        document.open();
        document.write(html);
        document.close();
      } catch (error) {
        document.body.innerHTML = '<p style="font-family:sans-serif;color:#b91c1c;padding:1rem">Hub Map লোড করা যায়নি। অনুগ্রহ করে পেজটি রিফ্রেশ করুন।</p>';
        console.error(error);
      }
    })();
  </script>
</body>
</html>
