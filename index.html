<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Hub Map — Interactive Hub Locator</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" />

<style>
  :root{
    --bg:#080d18;
    --panel:rgba(15,23,42,.78);
    --line:rgba(255,255,255,.09);
    --text:#e8eefc;
    --muted:#8ea2c0;
    --accent:#22d3ee;
    --accent2:#a78bfa;
    --glow:0 0 22px rgba(34,211,238,.45);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Noto Sans Bengali',sans-serif;
    background:var(--bg); color:var(--text); overflow:hidden;
  }
  #app{display:flex; height:100%;}

  /* ---------------- SIDEBAR ---------------- */
  #side{
    width:350px; flex:0 0 350px; display:flex; flex-direction:column;
    background:linear-gradient(180deg,#0d1526 0%,#080d18 100%);
    border-right:1px solid var(--line);
    position:relative; z-index:1200;
    box-shadow: 12px 0 40px rgba(0,0,0,.55);
  }
  #side header{
    display:flex; align-items:center; gap:12px;
    padding:18px 18px 14px; border-bottom:1px solid var(--line);
  }
  .logo{
    width:42px;height:42px;border-radius:13px;display:grid;place-items:center;
    font-size:20px;font-weight:800;color:#04121b;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:var(--glow);
  }
  #side h1{margin:0;font-size:16px;letter-spacing:.3px}
  #side header p{margin:2px 0 0;font-size:11.5px;color:var(--muted)}

  .searchwrap{padding:14px 16px 6px}
  .searchwrap input{
    width:100%; padding:11px 14px 11px 38px; border-radius:12px;
    background:rgba(255,255,255,.05); border:1px solid var(--line);
    color:var(--text); font-size:13.5px; outline:none;
    transition:.2s; font-family:inherit;
  }
  .searchwrap input:focus{
    border-color:rgba(34,211,238,.55);
    box-shadow:0 0 0 3px rgba(34,211,238,.12);
    background:rgba(255,255,255,.07);
  }
  .searchbox{position:relative}
  .searchbox::before{
    content:"⌕"; position:absolute; left:14px; top:50%; transform:translateY(-52%);
    color:var(--muted); font-size:17px; pointer-events:none;
  }

  .stats{display:flex; gap:10px; padding:12px 16px 10px}
  .stats > div{
    flex:1; background:rgba(255,255,255,.035); border:1px solid var(--line);
    border-radius:12px; padding:9px 10px; text-align:center;
  }
  .stats b{display:block; font-size:17px; color:var(--accent)}
  .stats span{font-size:10.5px; color:var(--muted); letter-spacing:.4px; text-transform:uppercase}

  #list{flex:1; overflow-y:auto; padding:4px 10px 14px;}
  #list::-webkit-scrollbar{width:8px}
  #list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:8px}
  #list::-webkit-scrollbar-track{background:transparent}

  .item{
    display:flex; gap:11px; align-items:center;
    padding:9px 11px; border-radius:11px; cursor:pointer;
    border:1px solid transparent; transition:.16s;
  }
  .item:hover{background:rgba(255,255,255,.055); border-color:var(--line)}
  .item.active{
    background:linear-gradient(90deg,rgba(34,211,238,.16),rgba(167,139,250,.09));
    border-color:rgba(34,211,238,.45);
  }
  .dot{
    width:9px;height:9px;border-radius:50%;flex:0 0 9px;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    box-shadow:0 0 10px rgba(34,211,238,.8);
  }
  .item .t{font-size:12.8px; line-height:1.3; overflow:hidden;
           display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical}
  .item .i{font-size:10px; color:var(--muted); margin-top:2px; font-variant-numeric:tabular-nums}
  .empty{padding:26px 14px; text-align:center; color:var(--muted); font-size:12.5px}

  #side footer{
    padding:11px 16px; font-size:10.5px; color:var(--muted);
    border-top:1px solid var(--line); text-align:center; letter-spacing:.3px;
  }

  /* ---------------- MAP ---------------- */
  #map{flex:1; height:100%; background:#05080f}
  .leaflet-container{background:#05080f; font-family:inherit}

  /* OSM লাইট ম্যাপ ডার্ক মোডে নেওয়ার ফিল্টার */
  #map.map-dark .leaflet-tile-pane{
    filter: invert(1) hue-rotate(180deg) brightness(0.85) contrast(1.1) saturate(0.8);
  }
  #map.map-dark .leaflet-control-attribution{
    background: rgba(10,16,28,.85) !important;
    color:#7c8ba3 !important;
  }
  #map.map-dark .leaflet-control-attribution a{ color:#22d3ee !important; }
  #map.map-dark .leaflet-control-scale-line{
    background: rgba(10,16,28,.75); color:#9fb0c8; border-color:#334155;
  }

  /* pin */
  .hub-pin{background:none!important; border:none!important}
  .hub-pin span{
    display:block; width:14px; height:14px; border-radius:50%;
    background:radial-gradient(circle at 32% 30%, #7ff3ff, #22d3ee 55%, #0b8fb0);
    box-shadow:0 0 0 2.5px rgba(34,211,238,.22), 0 0 14px rgba(34,211,238,.85);
    transition:transform .15s;
  }
  .hub-pin:hover span{transform:scale(1.45)}

  /* clusters */
  .cluster-icon{background:none!important;border:none!important}
  .cl{
    width:100%;height:100%;border-radius:50%;display:grid;place-items:center;
    font-size:12.5px;font-weight:800;color:#04121b;
    background:radial-gradient(circle at 30% 26%, rgba(167,139,250,.98), rgba(34,211,238,.92));
    border:1px solid rgba(255,255,255,.42);
    box-shadow:0 0 0 6px rgba(34,211,238,.11), 0 0 24px rgba(34,211,238,.5);
  }

  /* popup */
  .leaflet-popup-content-wrapper{
    background:linear-gradient(180deg,#111c31,#0b1322);
    color:var(--text); border-radius:16px; border:1px solid rgba(255,255,255,.13);
    box-shadow:0 22px 55px rgba(0,0,0,.7), 0 0 0 1px rgba(34,211,238,.16);
    padding:0;
  }
  .leaflet-popup-content{margin:0; width:auto!important}
  .leaflet-popup-tip{background:#0b1322; border:1px solid rgba(255,255,255,.13)}
  .leaflet-popup-close-button{color:var(--muted)!important; font-size:20px!important; padding:8px 9px 0 0!important}
  .leaflet-popup-close-button:hover{color:var(--accent)!important}

  .pop{padding:15px 16px 14px; min-width:236px}
  .pop .badge{
    display:inline-block; font-size:10px; font-weight:700; letter-spacing:.6px;
    padding:3px 9px; border-radius:999px; color:#04121b;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    margin-bottom:8px;
  }
  .pop h3{margin:0 0 11px; font-size:14.5px; line-height:1.35; font-weight:700}
  .pop .row{display:flex; gap:9px; align-items:flex-start; margin-bottom:7px; font-size:12px; color:#c9d6ea}
  .pop .row i{font-style:normal; opacity:.85; font-size:12.5px; line-height:1.45}
  .pop .row a{color:var(--accent); text-decoration:none; font-weight:600}
  .pop .row a:hover{text-decoration:underline}
  .pop .coords{font-variant-numeric:tabular-nums; letter-spacing:.2px}
  .pop .actions{display:flex; gap:8px; margin-top:12px}
  .pop .btn{
    flex:1; text-align:center; text-decoration:none; cursor:pointer;
    font-size:11.5px; font-weight:700; padding:8px 6px; border-radius:10px;
    color:#04121b; border:none; font-family:inherit;
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    transition:.18s;
  }
  .pop .btn:hover{filter:brightness(1.12); transform:translateY(-1px)}
  .pop .btn.ghost{
    background:rgba(255,255,255,.07); color:var(--text);
    border:1px solid rgba(255,255,255,.15);
  }

  /* map floating buttons */
  .mapbtns{position:absolute; right:14px; top:14px; z-index:1000; display:flex; flex-direction:column; gap:8px}
  .mbtn{
    width:40px; height:40px; border-radius:12px; cursor:pointer;
    display:grid; place-items:center; font-size:16px;
    background:rgba(15,23,42,.82); color:var(--text);
    border:1px solid rgba(255,255,255,.13); backdrop-filter:blur(10px);
    transition:.18s;
  }
  .mbtn:hover{border-color:rgba(34,211,238,.6); color:var(--accent); box-shadow:0 0 16px rgba(34,211,238,.3)}

  /* mobile */
  #menuBtn{display:none}
  @media (max-width:860px){
    #side{
      position:fixed; inset:0 auto 0 0; width:300px; flex:0 0 300px;
      transform:translateX(-102%); transition:transform .28s ease;
    }
    #side.open{transform:translateX(0)}
    #menuBtn{
      display:grid; position:absolute; left:14px; top:14px; z-index:1300;
      width:42px;height:42px;border-radius:12px;place-items:center;cursor:pointer;
      background:rgba(15,23,42,.85); border:1px solid rgba(255,255,255,.14);
      color:var(--text); font-size:18px; backdrop-filter:blur(10px);
    }
  }
</style>
</head>
<body>

<div id="app">
  <aside id="side">
    <header>
      <div class="logo">◈</div>
      <div>
        <h1>Hub Map</h1>
        <p>Steadfast Hub Locator</p>
      </div>
    </header>

    <div class="searchwrap">
      <div class="searchbox">
        <input id="q" type="text" placeholder="Search hub name / ID / phone…" autocomplete="off" />
      </div>
    </div>

    <div class="stats">
      <div><b id="cTotal">0</b><span>Total Hubs</span></div>
      <div><b id="cShown">0</b><span>Showing</span></div>
    </div>

    <div id="list"></div>
    <footer>Marker বা লিস্টে ক্লিক করলে ডিটেইলস দেখাবে</footer>
  </aside>

  <main style="position:relative;flex:1">
    <div id="map"></div>
    <div id="menuBtn">☰</div>
    <div class="mapbtns">
      <div class="mbtn" id="btnFit" title="Show all hubs">⛶</div>
      <div class="mbtn" id="btnZoomIn" title="Zoom in">＋</div>
      <div class="mbtn" id="btnZoomOut" title="Zoom out">−</div>
      <div class="mbtn" id="btnTheme" title="Toggle Theme">🌙</div>
    </div>
  </main>
</div>

/* =====================================================================
   MAP INIT
   ===================================================================== */
const hubs = HUBS.map(a => ({ id:a[0], name:a[1], lat:a[2], lng:a[3], phone:a[4]||'' }));

const map = L.map('map', {
  zoomControl:false,
  preferCanvas:true,
  worldCopyJump:true
}).setView([23.8103, 90.4125], 7);

/* 
  HOT OSM টাইল ব্যবহার করা হয়েছে। 
  এটি ওপেনস্ট্রিটম্যাপেরই একটি মিরর, যা লোকাল ফাইলে 403 ব্লক করে না 
  এবং বাংলাদেশের জেলা, উপজেলা, সড়কের নাম খুব সুন্দরভাবে দেখায়। 
*/
const osmTiles = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
  maxZoom: 19,
  subdomains: 'abc',
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, Tiles style by <a href="https://www.hotosm.org/">HOT</a>'
}).addTo(map);

/* ডিফল্টভাবে লাইট থিম (যেমনটা স্ক্রিনশটে আছে), ক্লাস রিমুভ করা হলো */
document.getElementById('map').classList.remove('map-dark');

L.control.scale({position:'bottomright', imperial:false}).addTo(map);

/* ---- marker icon ---- */
const pinIcon = L.divIcon({
  className:'hub-pin',
  html:'<span></span>',
  iconSize:[14,14],
  iconAnchor:[7,7],
  popupAnchor:[0,-9]
});

/* ---- cluster group ---- */
const clusters = L.markerClusterGroup({
  chunkedLoading:true,
  maxClusterRadius:55,
  spiderfyOnMaxZoom:true,
  showCoverageOnHover:false,
  removeOutsideVisibleBounds:true,
  iconCreateFunction: c => {
    const n = c.getChildCount();
    const size = n < 10 ? 34 : n < 50 ? 40 : n < 200 ? 46 : 54;
    return L.divIcon({
      html:`<div class="cl">${n}</div>`,
      className:'cluster-icon',
      iconSize:[size,size]
    });
  }
}).addTo(map);

/* ---- helpers ---- */
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

function popupHTML(h){
  const tel = (h.phone||'').replace(/[^\d+]/g,'');
  return `
  <div class="pop">
    <span class="badge">HUB ID #${h.id}</span>
    <h3>${esc(h.name)}</h3>
    <div class="row"><i>📍</i><span class="coords">${h.lat.toFixed(4)}, ${h.lng.toFixed(4)}</span></div>
    <div class="row"><i>📞</i><span>${tel ? `<a href="tel:${tel}">${esc(h.phone)}</a>` : '—'}</span></div>
    <div class="actions">
      <a class="btn" target="_blank" rel="noopener"
         href="https://www.google.com/maps?q=${h.lat},${h.lng}">Google Maps ↗</a>
      <button class="btn ghost" onclick="copyCoords(${h.lat},${h.lng},this)">Copy Coords</button>
    </div>
  </div>`;
}

window.copyCoords = function(lat,lng,btn){
  const t = `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  navigator.clipboard?.writeText(t).then(()=>{
    const o = btn.textContent;
    btn.textContent = '✓ Copied';
    setTimeout(()=>btn.textContent = o, 1200);
  });
};

/* ---- create markers ---- */
const markerById = new Map();
const activeId = { v:null };

hubs.forEach(h => {
  const m = L.marker([h.lat, h.lng], { icon:pinIcon, title:`#${h.id} · ${h.name}`, riseOnHover:true });
  m.bindPopup(() => popupHTML(h), { maxWidth:300, minWidth:250, autoPanPadding:[30,30] });
  m.on('click', () => setActive(h.id, false));
  markerById.set(h.id, m);
  clusters.addLayer(m);
});

/* =====================================================================
   SIDEBAR LIST + SEARCH
   ===================================================================== */
const listEl   = document.getElementById('list');
const qEl      = document.getElementById('q');
const cTotalEl = document.getElementById('cTotal');
const cShownEl = document.getElementById('cShown');

cTotalEl.textContent = hubs.length;
cShownEl.textContent = hubs.length;

const LIMIT = 300;

function renderList(items){
  cShownEl.textContent = items.length;
  if(!items.length){
    listEl.innerHTML = '<div class="empty">কোনো হাব পাওয়া যায়নি 🔍</div>';
    return;
  }
  const frag = document.createDocumentFragment();
  items.slice(0, LIMIT).forEach(h => {
    const d = document.createElement('div');
    d.className = 'item' + (h.id === activeId.v ? ' active' : '');
    d.dataset.id = h.id;
    d.innerHTML = `<div class="dot"></div>
      <div>
        <div class="t">${esc(h.name)}</div>
        <div class="i">#${h.id} · ${h.lat.toFixed(3)}, ${h.lng.toFixed(3)}</div>
      </div>`;
    d.addEventListener('click', () => focusHub(h.id, true));
    frag.appendChild(d);
  });
  listEl.innerHTML = '';
  listEl.appendChild(frag);

  if(items.length > LIMIT){
    const more = document.createElement('div');
    more.className = 'empty';
    more.textContent = `আরও ${items.length - LIMIT} টি হাব আছে — সার্চ করে দেখুন`;
    listEl.appendChild(more);
  }
}

let searchTimer;
qEl.addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    const q = qEl.value.trim().toLowerCase();
    const filtered = !q ? hubs : hubs.filter(h =>
      h.name.toLowerCase().includes(q) ||
      String(h.id).includes(q) ||
      (h.phone||'').replace(/\s/g,'').includes(q.replace(/\s/g,''))
    );
    renderList(filtered);
  }, 140);
});

/* =====================================================================
   FOCUS / ACTIVE STATE
   ===================================================================== */
function setActive(id, scroll){
  activeId.v = id;
  document.querySelectorAll('.item').forEach(el => {
    el.classList.toggle('active', Number(el.dataset.id) === id);
  });
  if(scroll){
    const el = document.querySelector(`.item[data-id="${id}"]`);
    el?.scrollIntoView({ block:'nearest', behavior:'smooth' });
  }
}

function focusHub(id, fromList){
  const h = hubs.find(x => x.id === id);
  const m = markerById.get(id);
  if(!h || !m) return;

  setActive(id, true);

  clusters.zoomToShowLayer(m, () => {
    map.flyTo([h.lat, h.lng], Math.max(map.getZoom(), 14), { duration:0.8 });
    setTimeout(() => m.openPopup(), 420);
  });

  if(window.innerWidth <= 860) document.getElementById('side').classList.remove('open');
}

/* =====================================================================
   MAP BUTTONS
   ===================================================================== */
document.getElementById('btnFit').addEventListener('click', () => {
  map.flyToBounds(clusters.getBounds(), { padding:[40,40], duration:1 });
});
document.getElementById('btnZoomIn').addEventListener('click', () => map.zoomIn());
document.getElementById('btnZoomOut').addEventListener('click', () => map.zoomOut());

/* Theme toggle — লাইট এবং ডার্ক মোডের মধ্যে সুইচ করে */
let isDark = false; // ডিফল্ট লাইট মোড
document.getElementById('btnTheme').addEventListener('click', e => {
  isDark = !isDark;
  document.getElementById('map').classList.toggle('map-dark', isDark);
  e.currentTarget.textContent = isDark ? '☀' : '🌙';
});

document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('side').classList.toggle('open');
});

/* =====================================================================
   BOOT
   ===================================================================== */
renderList(hubs);
setTimeout(() => map.flyToBounds(clusters.getBounds(), { padding:[40,40], duration:1.2 }), 350);
</script>
